<!DOCTYPE html>
<html>
<head>
    <title>A Secret For You</title>

    <style>
        body {
            background: #f5f1eb;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        img {
            width: 100%;
            border-radius: 15px;
            margin-top: 20px;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 20px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>You found the secret ❤️</h1>

        <p>
            I have something I've been wanting to tell you...
        </p>

        <h1>I Love You, Umme ❤️</h1>

        <img src="secret.jpg">

    </div>

</body>
</html>
